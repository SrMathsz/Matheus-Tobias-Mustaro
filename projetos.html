    <script src="script.js"></script>
    <script>
    /* ==========================================================
       EDITE AQUI SEUS PROJETOS
       Cada projeto é um bloco { ... }. Campos:
         grupo ("proprio" ou "cliente"), titulo, descricao,
         tags (lista), github (opcional), demo (opcional)
       Para adicionar um projeto, copie um bloco { ... } e separe
       os blocos por vírgula. Uma seção sem projetos some sozinha.
       ========================================================== */
    var projetos = [
        {
            grupo: "proprio",
            titulo: "Carros Abandonados",
            descricao: "Site criado para ajudar a prefeitura a localizar veículos abandonados e facilitar o recolhimento. Projeto com foco em utilidade pública, pensado para uso no celular e publicado online na Vercel.",
            tags: ["Web", "Mobile", "Vercel", "Utilidade pública"],
            github: "",
            demo: "https://carros-abandonados.vercel.app/"
        },
        {
            grupo: "proprio",
            titulo: "Espanhol App",
            descricao: "Aplicativo web para ajudar a aprender espanhol, com navegação por Início, Palavras e Perfil. Pensado para uso no celular e publicado online no GitHub Pages.",
            tags: ["HTML", "CSS", "JavaScript", "Espanhol", "Mobile"],
            github: "",
            demo: "https://srmathsz.github.io/spanishapp/"
        },
        {
            grupo: "cliente",
            titulo: "Giulia de Yemanjá Tarot",
            descricao: "Site de divulgação criado para uma taróloga. Apresenta o perfil e as especialidades dela e explica, em três etapas, como funciona uma leitura de tarot, com botões de contato direto por WhatsApp e Instagram.",
            tags: ["Site institucional", "Mobile", "GitHub Pages", "Cliente"],
            github: "",
            demo: "https://giuliacsilveira14-source.github.io/Giu-Yemanja/"
        },
        {
            grupo: "cliente",
            titulo: "Eliana Imóveis",
            descricao: "Site de divulgação criado para uma corretora de imóveis. Reúne os empreendimentos que ela trabalha em São Paulo, cada um com foto, descrição e botão para a página do empreendimento, além de links de contato por WhatsApp e Instagram.",
            tags: ["Site institucional", "Mobile", "GitHub Pages", "Cliente"],
            github: "",
            demo: "https://lianaimoveis9-sketch.github.io/Eliana-Site/"
        }
    ];

    /* --------------------- código da página --------------------- */
    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text) n.textContent = text;
        return n;
    }

    function linkExterno(texto, url) {
        var a = el("a", "", texto);
        a.href = url; a.target = "_blank"; a.rel = "noopener";
        return a;
    }

    function criarCard(p) {
        var card = el("article", "card project");
        var topo = el("div", "project-top");
        topo.appendChild(el("h3", "", p.titulo));
        card.appendChild(topo);
        card.appendChild(el("p", "", p.descricao));

        var tags = el("ul", "chips");
        (p.tags || []).forEach(function (t) { tags.appendChild(el("li", "chip", t)); });
        card.appendChild(tags);

        if (p.github || p.demo) {
            var links = el("div", "project-links");
            if (p.github) links.appendChild(linkExterno("GitHub ↗", p.github));
            if (p.demo) links.appendChild(linkExterno("Demo ↗", p.demo));
            card.appendChild(links);
        }
        return card;
    }

    function desenharGrupo(grupo, listaId, secaoId) {
        var itens = projetos.filter(function (p) { return p.grupo === grupo; });
        var secao = document.getElementById(secaoId);
        if (!itens.length) { secao.hidden = true; return; }
        var lista = document.getElementById(listaId);
        itens.forEach(function (p) { lista.appendChild(criarCard(p)); });
    }

    desenharGrupo("proprio", "lista-proprios", "sec-proprios");
    desenharGrupo("cliente", "lista-clientes", "sec-clientes");
    </script>
</body>
